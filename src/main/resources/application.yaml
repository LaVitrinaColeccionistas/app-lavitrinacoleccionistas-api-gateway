server:
  port: 8080

spring:
  application:
    name: app-lavitrinacoleccionistas-api-gateway
  config:
    import: optional:file:.env[.properties]
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          default-filters:
            - AddRequestHeader=X-Gateway, lavitrina
            - AddResponseHeader=X-Gateway, lavitrina
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                allowedHeaders:
                  - "*"
          routes:
            # Rutas de seguridad
            - id: seguridad
              uri: lb://app-lavitrinacoleccionistas-ms-seguridad
              predicates:
                - Path=/api/auth/**,/api/usuarios/**,/api/roles/**
            - id: seguridad-docs
              uri: lb://app-lavitrinacoleccionistas-ms-seguridad
              predicates:
                - Path=/docs/seguridad/v3/api-docs
              filters:
                - RewritePath=/docs/seguridad/(?<p>.*), /api/$\{p}
            # Rutas de catalogo
            - id: catalogo
              uri: lb://app-lavitrinacoleccionistas-ms-catalogo
              predicates:
                - Path=/api/productos/**,/api/publicaciones/**,/api/ofertas/**
            - id: catalogo-docs
              uri: lb://app-lavitrinacoleccionistas-ms-catalogo
              predicates:
                - Path=/docs/catalogo/v3/api-docs
              filters:
                - RewritePath=/docs/catalogo/(?<p>.*), /api/$\{p}
            #Rutas de intercambio
            - id: intercambios-soporte
              uri: lb://app-lavitrinacoleccionistas-ms-intercambios-soporte
              predicates:
                - Path=/api/intercambios/**,/api/tickets-soporte/**
            - id: intercambios-docs
              uri: lb://app-lavitrinacoleccionistas-ms-intercambios-soporte
              predicates:
                - Path=/docs/intercambios/v3/api-docs
              filters:
                - RewritePath=/docs/intercambios/(?<p>.*), /api/$\{p}
            #Rutas de compras
            - id: compras
              uri: lb://app-lavitrinacoleccionistas-ms-compras
              predicates:
                - Path=/api/ordenes/**,/api/reclamos/**
            - id: compras-docs
              uri: lb://app-lavitrinacoleccionistas-ms-compras
              predicates:
                - Path=/docs/compras/v3/api-docs
              filters:
                - RewritePath=/docs/compras/(?<p>.*), /api/$\{p}


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Seguridad
        url: /docs/seguridad/v3/api-docs
      - name: Intercambios y Soporte
        url: /docs/intercambios/v3/api-docs
      - name: Catalogo
        url: /docs/catalogo/v3/api-docs
      - name: Compras
        url: /docs/compras/v3/api-docs
logging:
  level:
    org.springframework.cloud.gateway: INFO


app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:lvc-auth}